<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817" />
      <stop offset="50%" stop-color="#0a1628" />
      <stop offset="100%" stop-color="#0d1f3c" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Magnifying Glass Rim -->
  <circle cx="28" cy="27" r="15" fill="none" stroke="url(#lensGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Inner Lens Flare -->
  <circle cx="28" cy="27" r="11" fill="rgba(0, 212, 255, 0.12)" />

  <!-- Data Analytics Bars inside Lens (SEO Data Extraction) -->
  <rect x="20" y="29" width="3" height="6" rx="1" fill="#10b981" />
  <rect x="25" y="24" width="3" height="11" rx="1" fill="#00d4ff" />
  <rect x="30" y="20" width="3" height="15" rx="1" fill="#2563eb" />
  <rect x="35" y="26" width="3" height="9" rx="1" fill="#f59e0b" />

  <!-- Search Sparkle / Star -->
  <circle cx="34" cy="18" r="1.5" fill="#ffffff" />
  <path d="M 34 14 L 35 18 L 39 18 L 36 20 L 37 24 L 34 21 L 31 24 L 32 20 L 29 18 L 33 18 Z" fill="#ffffff" opacity="0.4" />

  <!-- Handle -->
  <path d="M 39 38 L 52 51" stroke="url(#borderGrad)" stroke-width="5" stroke-linecap="round" />
  <circle cx="51" cy="50" r="3" fill="#00d4ff" />
</svg>
